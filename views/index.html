<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RKO // SUPREME - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #020408;
            --bg-panel: rgba(8, 13, 24, 0.98);
            --accent-cyan: #38bdf8;
            --accent-gold: #fbbf24;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 310px; background: rgba(3, 5, 10, 0.99); border-right: 1px solid rgba(255, 255, 255, 0.06); display: flex; flex-direction: column; height: 100vh; z-index: 100; }
        .sidebar-brand { padding: 22px; font-size: 20px; font-weight: 900; color: var(--accent-cyan); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .sidebar-menu { list-style: none; padding: 15px; overflow-y: auto; flex: 1; }
        .sidebar-menu::-webkit-scrollbar { width: 4px; }
        .sidebar-menu::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
        
        .menu-category { font-size: 11px; color: var(--text-muted); margin: 18px 10px 8px 0; font-weight: 800; text-transform: uppercase; }
        .sidebar-menu li { padding: 11px 15px; border-radius: 10px; margin-bottom: 5px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 14px; color: var(--text-muted); font-size: 14px; font-weight: 600; }
        .sidebar-menu li:hover { background: rgba(56, 189, 248, 0.08); color: var(--accent-cyan); }
        .sidebar-menu li.active { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #fff; }
        .badge-god { background: rgba(251, 191, 36, 0.2); color: #fde047; font-size: 9px; padding: 3px 8px; border-radius: 6px; margin-left: auto; font-weight: 800; }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: rgba(8, 13, 24, 0.9); padding: 18px 35px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; height: 75px; }
        .header-title { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .header-title span { color: var(--accent-cyan); }
        
        .user-badge { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.03); padding: 6px 18px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .avatar-glow { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(45deg, var(--accent-cyan), var(--accent-gold)); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; font-size: 12px; }

        .content-area { padding: 35px; overflow-y: auto; flex: 1; }
        .section-view { display: none; }
        .section-view.active { display: block !important; animation: godFade 0.3s ease; }
        @keyframes godFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .god-panel { background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 30px; margin-bottom: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .god-panel h3 { font-size: 18px; color: #fff; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 12px; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .god-input, .god-textarea { width: 100%; background: rgba(2, 4, 8, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); padding: 14px 18px; border-radius: 12px; color: #fff; font-size: 14px; }
        .god-textarea { height: 110px; resize: none; }

        .god-btn { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #fff; border: none; padding: 14px 28px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; transition: 0.3s; }
        .god-btn:hover { box-shadow: 0 8px 25px rgba(2, 132, 199, 0.6); }

        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1e293b; transition: .3s; border-radius: 26px; border: 1px solid rgba(255,255,255,0.1); }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-cyan); }
        input:checked + .slider:before { transform: translateX(24px); }

        .preview-box { background: rgba(2, 4, 8, 0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 20px; margin-top: 15px; }

        #god-toast { position: fixed; bottom: 35px; left: 35px; background: rgba(8, 13, 24, 0.98); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 16px 30px; border-radius: 14px; font-weight: 800; display: none; z-index: 3000; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <header>
            <div class="header-title">
                لوحة القيادة لـ Addons 977 / <span id="header-tracker">الرد التلقائي</span>
            </div>
            <div class="user-badge">
                <div class="avatar-glow">RK</div>
                <span style="font-weight: 700; font-size: 14px;">راكان (المالك)</span>
            </div>
        </header>

        <div class="content-area">
            <div class="god-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3><i class="fa-solid fa-reply"></i> المُشغِّل (Auto-Reply)</h3>
                    <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
                </div>
                
                <div class="form-group">
                    <label>الاسم (يظهر في لوحة التحكم فقط، ويُسفي الرد في قائمتك)</label>
                    <input type="text" class="god-input" placeholder="مثال: التحية">
                </div>

                <div class="form-group">
                    <label>التشغيل عند</label>
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <button class="god-btn" style="padding: 8px 16px; font-size: 13px;">T نص</button>
                        <button class="god-btn" style="padding: 8px 16px; font-size: 13px; background: #1e293b;"># قناة</button>
                    </div>
                    <input type="text" class="god-input" placeholder="مثال: السلام عليكم">
                </div>

                <div class="form-group">
                    <label>الرد (Embed & Message Builder)</label>
                    <div class="preview-box">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                            <div class="avatar-glow" style="width: 28px; height: 28px; font-size: 10px;">ZMN</div>
                            <span style="font-weight: 700; font-size: 13px;">ZMN Bot</span>
                            <span style="background: #5865f2; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px;">BOT</span>
                            <span style="font-size: 11px; color: var(--text-muted);">اليوم الساعة 12:00 ص</span>
                        </div>
                        <textarea class="god-textarea" placeholder="اكتب رسالتك هنا..."></textarea>
                    </div>
                    <button class="god-btn" style="margin-top: 15px;"><i class="fa-solid fa-plus"></i> إضافة إمبد</button>
                </div>
            </div>
        </div>
    </div>

    <div class="sidebar" style="order: 2;">
        <div class="sidebar-brand">
            <i class="fa-solid fa-crown" style="color: var(--accent-gold);"></i> RKO // SUPREME
        </div>
        <ul class="sidebar-menu">
            <div class="menu-category">المجتمع</div>
            <li class="active"><i class="fa-solid fa-reply"></i> الرد التلقائي <span class="badge-god">NEW</span></li>
            <li><i class="fa-solid fa-briefcase"></i> التوظيف</li>
            <li><i class="fa-solid fa-microphone"></i> القنوات الصوتية المؤقتة</li>
            <div class="menu-category">التخصيص والنظام</div>
            <li><i class="fa-solid fa-headset"></i> نظام التذاكر <span class="badge-god" style="background:rgba(56,189,248,0.2); color:var(--accent-cyan);">VIP</span></li>
            <li><i class="fa-solid fa-file-lines"></i> التقديمات <span class="badge-god">NEW</span></li>
        </ul>
    </div>

    <div id="god-toast"></div>
</body>
</html>
