<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم - بوت ركو</title>
    <!-- استدعاء خطوط وأيقونات عصرية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            min-height: 100vh;
        }
        /* القائمة الجانبية */
        .sidebar {
            width: 260px;
            background-color: #111827;
            border-left: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
        }
        .sidebar-brand {
            padding: 25px;
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-menu {
            list-style: none;
            padding: 20px 15px;
        }
        .sidebar-menu li {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #9ca3af;
        }
        .sidebar-menu li:hover, .sidebar-menu li.active {
            background-color: #1e293b;
            color: #38bdf8;
        }
        /* المحتوى الرئيسي */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #111827;
            padding: 20px 30px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        .user-info span {
            color: #38bdf8;
        }
        .dashboard-body {
            padding: 30px;
            overflow-y: auto;
        }
        /* الإحصائيات (الكروت) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background-color: #111827;
            border: 1px solid #1f2937;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .stat-card h3 {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }
        /* قسم التحكم والعمليات */
        .control-section {
            background-color: #111827;
            border: 1px solid #1f2937;
            padding: 25px;
            border-radius: 12px;
        }
        .control-section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            font-size: 14px;
        }
        .btn-primary {
            background-color: #0284c7;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0369a1;
        }
        .btn-danger {
            background-color: #dc2626;
            color: white;
        }
        .btn-danger:hover {
            background-color: #b91c1c;
        }
        /* صندوق التنبيه التفاعلي الواضح */
        #alert-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-robot"></i> ركو بوت
        </div>
        <ul class="sidebar-menu">
            <li class="active"><i class="fa-solid fa-house"></i> الرئيسية</li>
            <li><i class="fa-solid fa-server"></i> السيرفرات</li>
            <li><i class="fa-solid fa-terminal"></i> الأوامر</li>
            <li><i class="fa-solid fa-gear"></i> الإعدادات</li>
        </ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <header>
            <h1>لوحة التحكم الرئيسية</h1>
            <div class="user-info">
                مرحباً بك، <span>عمار</span>
            </div>
        </header>

        <div class="dashboard-body">
            <!-- كروت الإحصائيات -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>حالة البوت</h3>
                    <div class="value" style="color: #22c55e;"><i class="fa-solid fa-circle" style="font-size: 12px;"></i> أونلاين</div>
                </div>
                <div class="stat-card">
                    <h3>عدد السيرفرات</h3>
                    <div class="value">12 سيرفر</div>
                </div>
                <div class="stat-card">
                    <h3>المستخدمين</h3>
                    <div class="value">1,420 مستخدم</div>
                </div>
                <div class="stat-card">
                    <h3>استجابة البنق</h3>
                    <div class="value">24ms</div>
                </div>
            </div>

            <!-- أزرار التحكم بالبوت -->
            <div class="control-section">
                <h2>إدارة وتحكم البوت</h2>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="showMsg('تم إرسال أمر إعادة تشغيل البوت بنجاح! 🔄')">
                        <i class="fa-solid fa-rotate-right"></i> إعادة تشغيل البوت
                    </button>
                    <button class="btn btn-primary" onclick="showMsg('تم مسح ذاكرة التخزين المؤقت (Cache) بنجاح! 🧹')">
                        <i class="fa-solid fa-broom"></i> مسح الكاش
                    </button>
                    <button class="btn btn-danger" onclick="showMsg('تم إيقاف تشغيل الأوامر المؤقتة للصيانة! ⚠️')">
                        <i class="fa-solid fa-power-off"></i> وضع الصيانة
                    </button>
                </div>
                <!-- مكان ظهور التنبيه عند الضغط -->
                <div id="alert-box"></div>
            </div>
        </div>
    </div>

    <script>
        function showMsg(text) {
            const box = document.getElementById('alert-box');
            box.style.display = 'block';
            box.innerText = text;
            
            // إخفاء التنبيه تلقائياً بعد 4 ثواني
            setTimeout(() => {
                box.style.display = 'none';
            }, 4000);
        }
    </script>
</body>
</html>
