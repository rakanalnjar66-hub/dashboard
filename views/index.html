<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RKO BOT - Ultimate God-Tier Supreme Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #020408;
            --bg-panel: rgba(8, 13, 24, 0.92);
            --border-glow: rgba(56, 189, 248, 0.4);
            --accent-cyan: #38bdf8;
            --accent-neon: #a855f7;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-gold: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 310px;
            background: rgba(4, 7, 12, 0.98);
            backdrop-filter: blur(25px);
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-brand {
            padding: 22px 20px;
            font-size: 22px;
            font-weight: 900;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
        }

        .sidebar-menu {
            list-style: none;
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }

        .sidebar-menu::-webkit-scrollbar { width: 4px; }
        .sidebar-menu::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }

        .menu-category {
            font-size: 11px;
            color: var(--text-muted);
            margin: 18px 10px 8px 0;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-menu li {
            padding: 11px 15px;
            border-radius: 10px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .sidebar-menu li i {
            font-size: 15px;
            width: 22px;
            text-align: center;
            transition: transform 0.3s;
        }

        .sidebar-menu li:hover {
            background: rgba(56, 189, 248, 0.08);
            color: var(--accent-cyan);
            border-color: rgba(56, 189, 248, 0.15);
            transform: translateX(-4px);
        }

        .sidebar-menu li:hover i { transform: scale(1.2); }

        .sidebar-menu li.active {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff;
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.4);
            border-color: transparent;
        }

        .badge-god {
            background: rgba(251, 191, 36, 0.2);
            color: #fde047;
            font-size: 9px;
            padding: 3px 8px;
            border-radius: 6px;
            margin-right: auto;
            font-weight: 800;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: rgba(8, 13, 24, 0.75);
            backdrop-filter: blur(15px);
            padding: 20px 35px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title span { color: var(--accent-cyan); }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .avatar-glow {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-gold));
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }

        .content-area {
            padding: 35px;
            overflow-y: auto;
            flex: 1;
        }

        .section-view {
            display: none;
            animation: godFade 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .section-view.active { display: block; }

        @keyframes godFade {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .god-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .god-panel h3 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(3, 6, 12, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 22px;
            border-radius: 16px;
        }

        .stat-card h4 { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .stat-card .val { font-size: 26px; font-weight: 900; color: #fff; }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .god-input, .god-textarea, .god-select {
            width: 100%;
            background: rgba(2, 4, 8, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            transition: 0.3s;
        }

        .god-textarea { height: 120px; resize: none; }

        .god-input:focus, .god-textarea:focus, .god-select:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .god-btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(2, 132, 199, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .god-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.6);
        }

        /* شبكة الوحدات (Modules Grid) */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .module-card {
            background: rgba(3, 6, 12, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .module-card:hover { border-color: rgba(56, 189, 248, 0.4); }

        .module-info h4 { color: #fff; font-size: 15px; margin-bottom: 5px; }
        .module-info p { color: var(--text-muted); font-size: 12px; }

        /* زر التبديل التفاعلي (Toggle Switch) */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e293b; transition: .3s; border-radius: 26px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent-cyan); }
        input:checked + .slider:before { transform: translateX(24px); }

        .payment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .payment-card {
            background: rgba(3, 6, 12
